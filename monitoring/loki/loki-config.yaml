# =============================================================
# Loki - lưu trữ log tập trung (chế độ single binary, lưu trên filesystem)
# =============================================================
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h          # giữ log 7 ngày
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# ---- Ruler: chạy luật cảnh báo dựa trên LogQL, gửi sang Alertmanager ----
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules      # luật nằm ở /etc/loki/rules/fake/*.yml ("fake" = tenant mặc định)
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  evaluation_interval: 30s
  enable_api: true
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
