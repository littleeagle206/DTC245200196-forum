# =============================================================
# Reverse proxy cho website Forum và phpMyAdmin
# (Cổng bên trong container: 8080/8443/9443 vì Nginx chạy non-root)
# =============================================================

upstream forum_app {
    server app:3000;
    keepalive 16;
}

upstream pma {
    server phpmyadmin:80;
}

# ---------- 1) HTTP :80 -> chuyển hướng sang HTTPS ----------
server {
    listen 8080;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 2) HTTPS :443 -> Website Forum ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    include /etc/nginx/conf.d/ssl.inc;
    include /etc/nginx/conf.d/security-headers.inc;
    # CSP: chỉ cho phép tải script/style từ chính website -> giảm thiểu XSS
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

    limit_conn conn_limit 30;

    # Không cho người ngoài truy cập endpoint nội bộ
    location = /metrics { return 404; }
    location = /healthz { return 404; }

    # Trang đăng nhập: giới hạn 20 request/phút/IP (cho phép dồn 10) -> chống brute-force
    location = /login {
        limit_req zone=login_limit burst=10 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://forum_app;
    }

    location /static/ {
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://forum_app;
        expires 1h;
    }

    location / {
        limit_req zone=general_limit burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://forum_app;
    }
}

# ---------- 3) HTTPS :8443 -> phpMyAdmin (thêm lớp Basic Auth) ----------
server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    include /etc/nginx/conf.d/ssl.inc;
    include /etc/nginx/conf.d/security-headers.inc;

    # Lớp xác thực thứ nhất (Nginx) trước khi tới màn hình đăng nhập phpMyAdmin
    auth_basic           "Khu vuc quan tri CSDL";
    auth_basic_user_file /etc/nginx/htpasswd;

    # (Tùy chọn) chỉ cho phép dải mạng LAN/VMware truy cập:
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny  all;

    location / {
        include /etc/nginx/conf.d/proxy.inc;
        proxy_set_header Authorization "";   # không chuyển mật khẩu Basic Auth cho phpMyAdmin
        proxy_pass http://pma;
    }
}

# ---------- 4) stub_status nội bộ cho nginx-prometheus-exporter ----------
# Cổng 8081 KHÔNG được publish ra ngoài, chỉ truy cập trong mạng Docker
server {
    listen 8081;
    server_name _;
    access_log off;
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny  all;
    }
}
