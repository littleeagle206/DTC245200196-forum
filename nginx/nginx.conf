# =============================================================
# Cấu hình chính Nginx (image nginx-unprivileged, chạy bằng uid 101)
# =============================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Thư mục tạm đặt trong /tmp vì container chạy read-only
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Hardening: ẩn phiên bản Nginx trong header "Server" và trang lỗi
    server_tokens off;

    # Access log dạng JSON -> Promtail/Loki dễ phân tích bằng "| json"
    log_format json_log escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"protocol":"$server_protocol",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream":"$upstream_addr",'
          '"host":"$host",'
          '"referer":"$http_referer",'
          '"user_agent":"$http_user_agent"'
        '}';
    access_log /dev/stdout json_log;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 2m;           # giới hạn kích thước request
    client_body_timeout  15s;
    client_header_timeout 15s;

    # ---- Chống brute-force / DoS: giới hạn tần suất request theo IP ----
    # Chỉ tính các request POST (gửi mật khẩu); key rỗng = không bị giới hạn
    map $request_method $login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_limit_key    zone=login_limit:10m   rate=20r/m;   # đăng nhập: 20 lần/phút/IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;   # toàn site
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    include /etc/nginx/conf.d/*.conf;
}
