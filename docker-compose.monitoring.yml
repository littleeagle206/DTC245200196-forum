# =============================================================
# PHẦN 2 (COMMIT 2): Giám sát Prometheus + Grafana + Alertmanager
#   - cAdvisor        : metrics các container (CPU, RAM, mạng)
#   - node-exporter   : metrics máy chủ (VM)
#   - nginx-exporter  : metrics web server Nginx
#   - mysqld-exporter : metrics cơ sở dữ liệu MySQL
#   - app /metrics    : metrics của ứng dụng Forum (prom-client)
# =============================================================
services:
  # Cho app và nginx tham gia thêm mạng monitoring để Prometheus thu thập metrics
  app:
    networks:
      - monitoring
  nginx:
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: forum-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: forum-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.3.0
    container_name: forum-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Chua dat GRAFANA_ADMIN_PASSWORD trong .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: forum-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    # Ngoại lệ hardening: cAdvisor cần quyền đọc thông tin kernel/cgroup của máy chủ
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    mem_limit: 256m

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: forum-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: forum-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: forum-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_EXPORTER_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
